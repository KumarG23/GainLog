Match User gainlog-mcp-source
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/gainlog-mcp-source
    ForceCommand /opt/gainlog-mcp-source/.venv/bin/gainlog-mcp-send
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    X11Forwarding no
    AllowAgentForwarding no
