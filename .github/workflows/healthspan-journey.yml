name: Healthspan journey checks
on:
  push:
    branches: [feat/healthspan-v2-shell]
permissions:
  contents: read
concurrency:
  group: healthspan-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      TZ: America/New_York
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Backend tests on isolated fixtures
        run: python -m pytest backend/tests -q
        env:
          GAINLOG_DATABASE_URL: sqlite:////tmp/gainlog-test.db
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Export V2 web and Android JavaScript
        env:
          EXPO_PUBLIC_GAINLOG_V2_SHELL: '1'
        run: |
          npx expo export --platform web --output-dir dist-journey-web
          npx expo export --platform android --output-dir dist-journey-android
      - name: Export rollback navigation
        env:
          EXPO_PUBLIC_GAINLOG_V2_SHELL: '0'
          EXPO_PUBLIC_GAINLOG_V2_TODAY: '0'
        run: npx expo export --platform web --output-dir dist-journey-rollback
      - name: Package exact review source
        run: git archive --format=tar --output=review-source.tar HEAD
      # Archival is optional; an upload outage must not prevent or mask the gates above.
      - name: Archive reviewed source (optional)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: journey-review-source
          path: review-source.tar
          retention-days: 1
      - name: Archive web preview (optional)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: journey-web-preview
          path: dist-journey-web
          retention-days: 1
